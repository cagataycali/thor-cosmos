[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thor-cosmos"
version = "0.1.0"
description = "Strands agent wrapping NVIDIA Cosmos for Jetson AGX Thor edge deployment"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "cagataycali" }]
dependencies = [
    "strands-agents>=0.1.0",
    "strands-agents-tools>=0.1.0",
    "requests>=2.31",
    "pyyaml>=6.0",
    "pillow>=10.0",
    "nats-py>=2.6",
]

[project.optional-dependencies]
thor = [
    # Installed on-device — jetson-specific wheels
]
dev = [
    "pytest>=7",
    "ruff>=0.1",
]

[project.scripts]
thor-cosmos = "thor_cosmos.agent:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["thor_cosmos*"]
