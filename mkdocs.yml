site_name: thor-cosmos
site_url: https://cagataycali.github.io/thor-cosmos/
site_description: "Strands agent orchestrating the NVIDIA Cosmos ecosystem for Jetson AGX Thor edge deployment."
repo_url: https://github.com/cagataycali/thor-cosmos
repo_name: cagataycali/thor-cosmos
copyright: "Apache-2.0 · built on NVIDIA Cosmos + Strands Agents"

docs_dir: docs

extra_css:
  - stylesheets/extra.css?v=1
extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js

nav:
  - Home: index.md
  - Landing Page: landing/index.html
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quickstart: getting-started/quickstart.md
    - Thor Deployment: getting-started/thor-deploy.md
    - x86 Model Prep: getting-started/x86-prep.md
  - Guide:
    - Reason2 (VLM): guide/reason2.md
    - Predict 2.5 (World Model): guide/predict25.md
    - Transfer 2.5 (ControlNet): guide/transfer25.md
    - Xenna (Data Curation): guide/xenna.md
    - Training & Distillation: guide/training.md
    - Evaluation Metrics: guide/evaluation.md
  - Examples:
    - intbot_edge_vlm: examples/intbot-edge-vlm.md
    - GR00T-Dreams: examples/gr00t-dreams.md
    - Perception Loop: examples/perception-loop.md
  - Architecture: architecture.md
  - API Reference: api-reference.md

theme:
  name: material
  logo: assets/thor-animated.svg
  favicon: assets/thor.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    - scheme: default
      primary: black
      accent: light green
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: black
      accent: light green
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
  font:
    text: Inter
    code: JetBrains Mono

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/cagataycali/thor-cosmos
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/thor-cosmos/
  generator: false

plugins:
  - search
