<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="480" height="480" role="img" aria-label="thor-cosmos hero">
  <defs>
    <linearGradient id="hg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c4ff3e">
        <animate attributeName="stop-color" values="#c4ff3e;#76b900;#c4ff3e" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#76b900"/>
      <stop offset="100%" stop-color="#2a5700"/>
    </linearGradient>
    <radialGradient id="cg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1">
        <animate attributeName="stop-opacity" values="1;0.4;1" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="30%" stop-color="#c4ff3e" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#76b900" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#76b900" stop-opacity="0"/>
    </radialGradient>
    <filter id="sg" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
  </defs>

  <circle cx="240" cy="240" r="230" fill="#0a0a0a" opacity="0.03"/>
  <circle cx="240" cy="240" r="180" fill="url(#cg)" opacity="0.45"/>

  <!-- Outer hex -->
  <g filter="url(#sg)">
    <polygon points="240,30 395,125 395,325 240,420 85,325 85,125"
             fill="none" stroke="url(#hg)" stroke-width="5" stroke-linejoin="round">
      <animateTransform attributeName="transform" type="rotate"
        from="0 240 240" to="360 240 240" dur="32s" repeatCount="indefinite"/>
    </polygon>
  </g>

  <!-- Middle hex (dashed, counter) -->
  <polygon points="240,80 355,145 355,305 240,370 125,305 125,145"
           fill="none" stroke="#76b900" stroke-width="3"
           stroke-dasharray="6 10" opacity="0.7">
    <animateTransform attributeName="transform" type="rotate"
      from="360 240 240" to="0 240 240" dur="24s" repeatCount="indefinite"/>
  </polygon>

  <!-- Inner hex -->
  <polygon points="240,130 320,175 320,265 240,310 160,265 160,175"
           fill="#0a0a0a" stroke="#c4ff3e" stroke-width="2.5" opacity="0.95">
    <animateTransform attributeName="transform" type="rotate"
      from="0 240 240" to="360 240 240" dur="16s" repeatCount="indefinite"/>
  </polygon>

  <!-- Core pulse -->
  <circle cx="240" cy="240" r="22" fill="url(#cg)">
    <animate attributeName="r" values="18;28;18" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="240" cy="240" r="8" fill="#ffffff">
    <animate attributeName="opacity" values="1;0.6;1" dur="1.4s" repeatCount="indefinite"/>
  </circle>

  <!-- Orbiters -->
  <g>
    <circle r="5" fill="#c4ff3e" filter="url(#sg)">
      <animateMotion dur="8s" repeatCount="indefinite"
        path="M 240 40 A 200 200 0 1 1 239.9 40 Z"/>
    </circle>
    <circle r="3" fill="#ffffff" opacity="0.9">
      <animateMotion dur="12s" repeatCount="indefinite"
        path="M 240 80 A 160 160 0 1 0 239.9 80 Z"/>
    </circle>
    <circle r="2" fill="#c4ff3e" opacity="0.7">
      <animateMotion dur="18s" repeatCount="indefinite"
        path="M 240 120 A 120 120 0 1 1 239.9 120 Z"/>
    </circle>
  </g>
</svg>
